<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Solana Counter</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .card {
      width: 360px;
      padding: 32px;
      border-radius: 18px;
      background: #1c1c1c;
      text-align: center;
      box-shadow: 0 0 30px rgba(0,0,0,0.4);
    }

    h1 {
      margin-bottom: 10px;
    }

    .network {
      opacity: 0.7;
      margin-bottom: 25px;
    }

    .count {
      font-size: 64px;
      font-weight: bold;
      margin: 25px 0;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
    }

    #connectBtn {
      background: #6c5ce7;
      color: white;
    }

    #incrementBtn {
      background: #00c853;
      color: white;
    }

    #incrementBtn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    #status {
      margin-top: 20px;
      font-size: 14px;
      word-break: break-word;

#resetBtn { background: #ff6b6b; color: white; }
#resetBtn:disabled { opacity: 0.4; cursor: not-allowed; }
    }
  </style>
</head>

<body>

  <div class="card">

    <h1>Solana Counter</h1>

    <div class="network">
      Solana Devnet
    </div>

    <div>Current Count</div>

    <div id="count" class="count">
      --
    </div>

    <button id="connectBtn">
      Connect Wallet
    </button>

    <button id="incrementBtn" disabled>
      Increment Counter
    </button>
<button id="resetBtn" disabled>
  Reset Counter
</button>


    <div id="status">
      Wallet not connected
    </div>

  </div>

  <script type="module" src="app.js"></script>

</body>
</html>
